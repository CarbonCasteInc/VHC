name: VHC Pager Dead-Man

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vhc-pager-deadman
  cancel-in-progress: false

jobs:
  check-pager:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deadman.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check pager health
        id: deadman
        env:
          VH_PAGER_HEALTH_URL: ${{ secrets.VH_PAGER_HEALTH_URL }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/vhc-pager-deadman
          if node tools/scripts/vhc-pager-deadman.mjs --health-url "$VH_PAGER_HEALTH_URL" > .tmp/vhc-pager-deadman/result.json; then
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"
            cat .tmp/vhc-pager-deadman/result.json
          fi
      - name: Upload dead-man evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vhc-pager-deadman
          path: .tmp/vhc-pager-deadman/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Fail workflow on unhealthy pager
        if: always() && steps.deadman.outputs.status == 'fail'
        run: exit 1

  open-incident:
    needs: check-pager
    if: >-
      always()
      && needs.check-pager.outputs.status == 'fail'
      && vars.VH_PAGER_GITHUB_ISSUES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download dead-man evidence
        uses: actions/download-artifact@v4
        with:
          name: vhc-pager-deadman
          path: .tmp/vhc-pager-deadman
      - name: Open deduplicated pager dead-man issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARKER='<!-- vhc-pager-deadman:v1 -->'
          {
            echo "$MARKER"
            echo
            echo 'The dependency-free pager dead-man probe reported an unhealthy state.'
            echo
            echo "Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```json'
            cat .tmp/vhc-pager-deadman/result.json
            echo '```'
          } > .tmp/vhc-pager-deadman/issue.md

          EXISTING="$(
            gh issue list \
              --state open \
              --limit 1000 \
              --json number,body \
              --jq 'map(select((.body // "") | contains("<!-- vhc-pager-deadman:v1 -->")))[0].number // ""'
          )"
          if [[ -n "$EXISTING" ]]; then
            echo "Pager dead-man incident already open as #${EXISTING}; no duplicate created."
            exit 0
          fi

          gh issue create \
            --title "[A6 incident] pager dead-man failed" \
            --label incident \
            --label a6 \
            --label public-feed \
            --label severity:critical \
            --label needs-codex-triage \
            --body-file .tmp/vhc-pager-deadman/issue.md
